# cp (MERC-178): Creative Planet build of plane-backend (apps/api) with our cp: patches.
# Publishes ghcr.io/webdany2k/plane-backend:<tag> when a cp-v* tag is pushed (e.g. cp-v1.5.0-1).
# Built here, never on the production VM (see plane-ops/plane-vm/GITHUB.md).
name: cp build plane-backend

on:
  push:
    tags:
      - "cp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. cp-v1.5.0-1)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cp-build-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'webdany2k/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^cp-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "Invalid tag: $TAG (expected cp-vX.Y.Z-N)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/webdany2k/plane-backend:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/webdany2k/plane
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
